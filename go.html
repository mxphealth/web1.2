<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting...</title>
<style>
body { margin: 0; padding: 40px 20px; font-family: system-ui, -apple-system, sans-serif; text-align: center; background: #f6faf8; color: #17231e; }
.loader { margin: 40px auto; width: 40px; height: 40px; border: 4px solid #dce7e2; border-top-color: #16845b; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.error { color: #c0392b; margin-top: 20px; }
</style>
</head>
<body>
<div class="loader"></div>
<p id="status">Redirecting to product page...</p>

<script>
(function() {
  "use strict";

  // Google Sheet CSV URL (same as products-data.js)
  var SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQd5A8sZ0ttf4fB--kQLbqJMK8ZJGIH4aPFpMoKY56Kqq8nZImezdkQppmHPlQT69jLDB8iFl6c5Tt3/pub?gid=0&single=true&output=csv";

  // Extract slug from URL path
  var path = window.location.pathname;
  var slug = path.split('/').pop().toLowerCase().replace(/[^a-z0-9-]/g, '');

  if (!slug) {
    showError("Invalid product link.");
    return;
  }

  // Fetch and parse the Google Sheet
  fetch(SHEET_CSV_URL, { cache: "no-store" })
    .then(function(response) {
      if (!response.ok) throw new Error("Sheet unavailable");
      return response.text();
    })
    .then(function(csv) {
      var rows = parseCSV(csv);
      var product = findProduct(rows, slug);
      
      if (product && product.affiliate_link) {
        // Immediate redirect
        window.location.replace(product.affiliate_link);
      } else {
        showError("Product not found or link unavailable.");
      }
    })
    .catch(function(error) {
      console.error("Redirect error:", error);
      showError("Unable to load product. Please try again.");
    });

  // Parse CSV into array of objects
  function parseCSV(text) {
    var rows = [], row = [], field = "", quoted = false, i, ch;
    text = String(text || "").replace(/^\uFEFF/, "");

    for (i = 0; i < text.length; i++) {
      ch = text[i];
      if (quoted) {
        if (ch === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else { quoted = false; }
        } else { field += ch; }
      } else if (ch === '"') { quoted = true; }
      else if (ch === ",") { row.push(field); field = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && text[i + 1] === "\n") i++;
        row.push(field); field = ""; rows.push(row); row = [];
      } else { field += ch; }
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }

    rows = rows.filter(function(r) { return r.some(function(x) { return String(x).trim() !== ""; }); });
    if (!rows.length) return [];

    var head = rows[0].map(function(h) { return String(h).trim().toLowerCase(); });
    return rows.slice(1).map(function(r) {
      var o = {};
      head.forEach(function(h, k) { o[h] = r[k] == null ? "" : String(r[k]).trim(); });
      return o;
    });
  }

  // Find product by slug
  function findProduct(rows, slug) {
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      if (row.status !== "live" || !row.name) continue;
      
      var productSlug = row.name.toLowerCase()
        .replace(/\u00df/g, "ss")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
      
      if (productSlug === slug) return row;
    }
    return null;
  }

  function showError(msg) {
    document.getElementById("status").innerHTML = '<span class="error">' + msg + '</span>';
    document.querySelector(".loader").style.display = "none";
  }

})();
</script>
</body>
</html>
