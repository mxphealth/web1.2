<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<title>Contact MaxproHealth | Send an Inquiry</title>
<meta name="description" content="Contact MaxproHealth with questions, product inquiries, partnership requests, K-Beauty inquiries, or general feedback.">
<meta name="robots" content="index, follow">
<meta name="author" content="MaxproHealth">
<meta name="theme-color" content="#16845b">
<link rel="canonical" href="https://maxprohealth.pages.dev/contact">
<style>
:root {
  --page-bg: #f6faf8;
  --surface: #ffffff;
  --surface-soft: #f1f7f4;
  --text: #17231e;
  --muted: #66756e;
  --border: #dce7e2;
  --accent: #16845b;
  --accent-dark: #0d6846;
  --danger: #c0392b;
  --shadow: 0 20px 55px rgba(20,55,42,.10);
}

html.dark {
  --page-bg: #101714;
  --surface: #17201c;
  --surface-soft: #1d2924;
  --text: #f1f6f3;
  --muted: #a5b2ab;
  --border: #304039;
  --accent: #40c88d;
  --accent-dark: #59d79e;
  --danger: #ff8074;
  --shadow: 0 20px 55px rgba(0,0,0,.30);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--page-bg);
  color: var(--text);
  font-family: Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  line-height: 1.6;
}

button, input, select, textarea { font: inherit; }
button { cursor: pointer; }

.mxp-contact-page { width: 100%; padding: 55px 20px 70px; }
.mxp-contact-container { width: min(70%, 920px); margin: 0 auto; }
.mxp-contact-hero { text-align: center; margin-bottom: 34px; }

.mxp-contact-eyebrow {
  display: inline-block;
  margin-bottom: 10px;
  color: var(--accent);
  font-size: .78rem;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.mxp-contact-hero h1 {
  margin: 0;
  color: var(--text);
  font-size: clamp(2rem,4vw,3rem);
  line-height: 1.12;
  letter-spacing: -.04em;
}

.mxp-contact-hero p {
  max-width: 650px;
  margin: 14px auto 0;
  color: var(--muted);
  font-size: 1rem;
}

.mxp-contact-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 22px;
  box-shadow: var(--shadow);
  padding: clamp(24px,4vw,42px);
}

.mxp-form { display: grid; gap: 18px; }
.mxp-field { width: 100%; }

.mxp-input, .mxp-select, .mxp-textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  color: var(--text);
  outline: none;
  transition: border-color .2s ease, box-shadow .2s ease;
}

.mxp-input, .mxp-select { min-height: 54px; padding: 0 15px; }

.mxp-textarea {
  min-height: 220px;
  padding: 15px;
  resize: vertical;
  line-height: 1.55;
}

.mxp-input::placeholder, .mxp-textarea::placeholder { color: var(--muted); opacity: .9; }

.mxp-input:focus, .mxp-select:focus, .mxp-textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(22,132,91,.12);
}

.mxp-phone-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.mxp-character-counter {
  display: block;
  width: 100%;
  margin-top: 6px;
  padding-right: 2px;
  color: var(--muted);
  text-align: right;
  font-size: .78rem;
}

/* Consent */
.mxp-consent {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  color: var(--muted);
  font-size: .86rem;
  line-height: 1.5;
}

.mxp-consent input {
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  margin: 2px 0 0;
  accent-color: var(--accent);
}

.mxp-consent a {
  color: var(--accent-dark);
  font-weight: 650;
  text-decoration: underline;
  text-underline-offset: 3px;
}

/* Turnstile */
.mxp-turnstile { min-height: 65px; }

.mxp-form-status { min-height: 22px; margin: 0; color: var(--danger); font-size: .84rem; }
.mxp-form-status.success { color: var(--accent); }
.mxp-required-note { margin: -4px 0 0; color: var(--muted); font-size: .76rem; }
.mxp-noscript { margin: 0; color: var(--danger); font-size: .86rem; }

.mxp-submit {
  width: 100%;
  min-height: 56px;
  border: 0;
  border-radius: 12px;
  background: var(--accent);
  color: #fff;
  font-weight: 800;
  font-size: 1rem;
  transition: background .2s ease, transform .2s ease, opacity .2s ease;
}

.mxp-submit:hover { background: var(--accent-dark); transform: translateY(-1px); }
.mxp-submit:disabled { opacity: .65; cursor: not-allowed; transform: none; }

.mxp-honeypot {
  position: absolute !important;
  left: -9999px !important;
  width: 1px !important;
  height: 1px !important;
  opacity: 0 !important;
  pointer-events: none !important;
}

@media (max-width:900px) {
  .mxp-contact-container { width: min(90%,920px); }
}

@media (max-width:700px) {
  .mxp-contact-page { padding: 35px 14px 55px; }
  .mxp-contact-container { width: 100%; }
  .mxp-contact-card { border-radius: 18px; padding: 22px 16px; }
  .mxp-contact-hero { margin-bottom: 24px; }
  .mxp-contact-hero h1 { font-size: 2rem; }
}

@media (max-width:520px) {
  .mxp-phone-row { grid-template-columns: 1fr 1fr; gap: 8px; }
  .mxp-input, .mxp-select { min-height: 52px; }
  .mxp-textarea { min-height: 210px; }
}

@media (prefers-reduced-motion:reduce) {
  html { scroll-behavior:auto; }
  .mxp-input, .mxp-select, .mxp-textarea, .mxp-submit { transition:none; }
}
</style>

<!-- Country data -->
<script src="/countries.js" defer></script>
<!-- Cloudflare Turnstile -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>

<div id="mxp-global-header"></div>

<main class="mxp-contact-page">
  <div class="mxp-contact-container">

    <section class="mxp-contact-hero" aria-labelledby="contact-title">
      <span class="mxp-contact-eyebrow">Contact MaxproHealth</span>
      <h1 id="contact-title">Send us a message</h1>
      <p>Have a question, suggestion, partnership inquiry, or need more information? Send us your inquiry and our team will review your message.</p>
    </section>

    <section class="mxp-contact-card" aria-label="Contact form">
      <form class="mxp-form" id="mxpContactForm" novalidate>

        <input class="mxp-honeypot" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">

        <div class="mxp-field">
          <input class="mxp-input" id="mxpName" name="name" type="text" placeholder="Full name *" autocomplete="name" maxlength="100" aria-label="Full name" required>
        </div>

        <div class="mxp-field">
          <input class="mxp-input" id="mxpEmail" name="email" type="email" placeholder="Email address *" autocomplete="email" maxlength="150" aria-label="Email address" required>
        </div>

        <div class="mxp-field">
          <div class="mxp-phone-row">
            <select class="mxp-select" id="mxpCountry" name="country_code" aria-label="Country calling code" required></select>
            <input class="mxp-input" id="mxpPhone" name="phone" type="tel" placeholder="Phone number *" autocomplete="tel" inputmode="tel" maxlength="30" aria-label="Phone number" required>
          </div>
        </div>

        <div class="mxp-field">
          <select class="mxp-select" id="mxpTopic" name="inquiry_topic" aria-label="Inquiry topic" required>
            <option value="" selected disabled>--- Select Inquiry Topic ---</option>
            <option value="General Inquiry">General Inquiry</option>
            <option value="Product Information">Product Information</option>
            <option value="Business Partnership">Business Partnership</option>
            <option value="K-Beauty / Supplier Inquiry">K-Beauty / Supplier Inquiry</option>
            <option value="Website / Content Feedback">Website / Content Feedback</option>
          </select>
        </div>

        <div class="mxp-field">
          <input class="mxp-input" id="mxpCompany" name="company" type="text" placeholder="Company (optional)" autocomplete="organization" maxlength="150" aria-label="Company (optional)">
        </div>

        <div class="mxp-field">
          <textarea class="mxp-textarea" id="mxpMessage" name="message" placeholder="Please tell us how we can help... or Your message..." maxlength="2000" aria-label="Your message" required></textarea>
          <span class="mxp-character-counter" id="mxpCharacterCounter" aria-live="polite">0/2000 characters</span>
        </div>

        <div class="mxp-field">
          <label class="mxp-consent" for="mxpConsent">
            <input id="mxpConsent" name="consent" type="checkbox" value="yes" required>
            <span>I agree that MaxproHealth may use my details to respond to this inquiry, as described in the <a href="/privacy-policy" target="_blank" rel="noopener">Privacy Policy</a>. *</span>
          </label>
        </div>

        <div class="mxp-field mxp-turnstile">
          <!-- Replace 0x4AAAAAAFZJXd6vRWYHAnvv with your Cloudflare Turnstile site key -->
          <div class="cf-turnstile" data-sitekey="0x4AAAAAAFZJXd6vRWYHAnvv" data-theme="auto"></div>
        </div>

        <noscript><p class="mxp-noscript">JavaScript is required to send this form.</p></noscript>

        <p class="mxp-form-status" id="mxpFormStatus" role="status" aria-live="polite"></p>
        <p class="mxp-required-note">* Required fields</p>

        <button class="mxp-submit" id="mxpSubmit" type="submit">Send Inquiry</button>
      </form>
    </section>

  </div>
</main>

<div id="mxp-global-footer"></div>
<div id="mxp-global-scroll-top"></div>

<script>
(function () {
  "use strict";

  /* ============ GLOBAL HEADER / FOOTER ============ */
  var headerContainer = document.getElementById("mxp-global-header");
  var footerContainer = document.getElementById("mxp-global-footer");
  var scrollTopContainer = document.getElementById("mxp-global-scroll-top");

  function executeInsertedScripts(container) {
    container.querySelectorAll("script").forEach(function (oldScript) {
      var newScript = document.createElement("script");
      Array.from(oldScript.attributes).forEach(function (attribute) {
        newScript.setAttribute(attribute.name, attribute.value);
      });
      newScript.textContent = oldScript.textContent;
      oldScript.parentNode.replaceChild(newScript, oldScript);
    });
  }

  function loadGlobalPart(url, target) {
    return fetch(url, { method: "GET", credentials: "same-origin", cache: "no-cache" })
      .then(function (response) {
        if (!response.ok) { throw new Error("Unable to load " + url); }
        return response.text();
      })
      .then(function (html) {
        target.innerHTML = html;
        executeInsertedScripts(target);
      });
  }

  Promise.all([
    loadGlobalPart("/header.html", headerContainer),
    loadGlobalPart("/footer.html", footerContainer),
    loadGlobalPart("/scroll-top.html", scrollTopContainer)
  ]).catch(function (error) {
    console.warn("MaxproHealth global component error:", error);
  });

  /* ============ MESSAGE COUNTER ============ */
  var message = document.getElementById("mxpMessage");
  var counter = document.getElementById("mxpCharacterCounter");

  message.addEventListener("input", function () {
    counter.textContent = message.value.length + "/2000 characters";
  });

  /* ============ FORM SUBMISSION ============ */
  var form = document.getElementById("mxpContactForm");
  var topic = document.getElementById("mxpTopic");
  var status = document.getElementById("mxpFormStatus");
  var submitButton = document.getElementById("mxpSubmit");

  function setStatus(text, success) {
    status.textContent = text;
    status.classList.toggle("success", !!success);
  }

  function resetTurnstile() {
    if (window.turnstile && typeof window.turnstile.reset === "function") {
      try { window.turnstile.reset(); } catch (error) { /* ignore */ }
    }
  }

  function unlock() {
    submitButton.disabled = false;
    submitButton.textContent = "Send Inquiry";
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    setStatus("", false);

    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }

    if (!topic.value) {
      setStatus("Please select an inquiry topic.", false);
      topic.focus();
      return;
    }

    var tokenField = form.querySelector('[name="cf-turnstile-response"]');
    if (!tokenField || !tokenField.value) {
      setStatus("Please complete the verification check.", false);
      return;
    }

    submitButton.disabled = true;
    submitButton.textContent = "Sending...";

    fetch("/api/contact", {
      method: "POST",
      body: new FormData(form),
      headers: { "Accept": "application/json" }
    })
      .then(function (response) {
        return response.json().catch(function () { return {}; }).then(function (data) {
          return { ok: response.ok, data: data };
        });
      })
      .then(function (result) {
        if (result.ok && result.data && result.data.ok) {
          window.location.href = "/thank-you.html";
          return;
        }
        throw new Error((result.data && result.data.error) || "Something went wrong. Please try again.");
      })
      .catch(function (error) {
        console.error("MaxproHealth contact form error:", error);
        setStatus(error && error.message ? error.message : "Something went wrong. Please try again.", false);
        resetTurnstile();
        unlock();
      });
  });
})();
</script>

</body>
</html>
