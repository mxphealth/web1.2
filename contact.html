<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Favicon & app icons -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">


<title>Contact MaxproHealth | Send an Inquiry</title>

<meta name="description" content="Contact MaxproHealth with questions, product inquiries, partnership requests, K-Beauty inquiries, or general feedback.">
<meta name="robots" content="index, follow">
<meta name="author" content="MaxproHealth">
<meta name="theme-color" content="#16845b">

<link rel="canonical" href="https://maxprohealth.pages.dev/contact">

<style>
:root {
  --page-bg: #f6faf8;
  --surface: #ffffff;
  --surface-soft: #f1f7f4;
  --text: #17231e;
  --muted: #66756e;
  --border: #dce7e2;
  --accent: #16845b;
  --accent-dark: #0d6846;
  --danger: #c0392b;
  --shadow: 0 20px 55px rgba(20,55,42,.10);
}

html.dark {
  --page-bg: #101714;
  --surface: #17201c;
  --surface-soft: #1d2924;
  --text: #f1f6f3;
  --muted: #a5b2ab;
  --border: #304039;
  --accent: #40c88d;
  --accent-dark: #59d79e;
  --danger: #ff8074;
  --shadow: 0 20px 55px rgba(0,0,0,.30);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--page-bg);
  color: var(--text);
  font-family:
    Inter,
    "Segoe UI",
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;
  line-height: 1.6;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.mxp-contact-page {
  width: 100%;
  padding: 55px 20px 70px;
}

.mxp-contact-container {
  width: min(70%, 920px);
  margin: 0 auto;
}

.mxp-contact-hero {
  text-align: center;
  margin-bottom: 34px;
}

.mxp-contact-eyebrow {
  display: inline-block;
  margin-bottom: 10px;
  color: var(--accent);
  font-size: .78rem;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.mxp-contact-hero h1 {
  margin: 0;
  color: var(--text);
  font-size: clamp(2rem,4vw,3rem);
  line-height: 1.12;
  letter-spacing: -.04em;
}

.mxp-contact-hero p {
  max-width: 650px;
  margin: 14px auto 0;
  color: var(--muted);
  font-size: 1rem;
}

.mxp-contact-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 22px;
  box-shadow: var(--shadow);
  padding: clamp(24px,4vw,42px);
}

.mxp-form {
  display: grid;
  gap: 18px;
}

.mxp-field {
  width: 100%;
}

.mxp-input,
.mxp-select,
.mxp-textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  color: var(--text);
  outline: none;
  transition:
    border-color .2s ease,
    box-shadow .2s ease;
}

.mxp-input,
.mxp-select {
  min-height: 54px;
  padding: 0 15px;
}

.mxp-textarea {
  min-height: 220px;
  padding: 15px;
  resize: vertical;
  line-height: 1.55;
}

.mxp-input::placeholder,
.mxp-textarea::placeholder {
  color: var(--muted);
  opacity: .9;
}

.mxp-input:focus,
.mxp-select:focus,
.mxp-textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(22,132,91,.12);
}

.mxp-phone-row,
.mxp-captcha-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.mxp-character-counter {
  display: block;
  width: 100%;
  margin-top: 6px;
  padding-right: 2px;
  color: var(--muted);
  text-align: right;
  font-size: .78rem;
}

.mxp-captcha-display {
  min-height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border);
  border-radius: 12px;
  background:
    repeating-linear-gradient(
      135deg,
      var(--surface-soft),
      var(--surface-soft) 7px,
      var(--surface) 7px,
      var(--surface) 14px
    );
  color: var(--text);
  font-family: "Courier New",monospace;
  font-size: 1.15rem;
  font-weight: 800;
  letter-spacing: .18em;
  user-select: none;
}

.mxp-captcha-refresh {
  display: block;
  width: fit-content;
  margin: 7px 0 0 auto;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--accent);
  font-size: .78rem;
  font-weight: 700;
}

.mxp-form-status {
  min-height: 22px;
  margin: 0;
  color: var(--danger);
  font-size: .84rem;
}

.mxp-form-status.success {
  color: var(--accent);
}

.mxp-required-note {
  margin: -4px 0 0;
  color: var(--muted);
  font-size: .76rem;
}

.mxp-submit {
  width: 100%;
  min-height: 56px;
  border: 0;
  border-radius: 12px;
  background: var(--accent);
  color: #fff;
  font-weight: 800;
  font-size: 1rem;
  transition:
    background .2s ease,
    transform .2s ease,
    opacity .2s ease;
}

.mxp-submit:hover {
  background: var(--accent-dark);
  transform: translateY(-1px);
}

.mxp-submit:disabled {
  opacity: .65;
  cursor: not-allowed;
  transform: none;
}

.mxp-honeypot {
  position: absolute !important;
  left: -9999px !important;
  width: 1px !important;
  height: 1px !important;
  opacity: 0 !important;
  pointer-events: none !important;
}

@media (max-width:900px) {
  .mxp-contact-container {
    width: min(90%,920px);
  }
}

@media (max-width:700px) {
  .mxp-contact-page {
    padding: 35px 14px 55px;
  }

  .mxp-contact-container {
    width: 100%;
  }

  .mxp-contact-card {
    border-radius: 18px;
    padding: 22px 16px;
  }

  .mxp-contact-hero {
    margin-bottom: 24px;
  }

  .mxp-contact-hero h1 {
    font-size: 2rem;
  }
}

@media (max-width:520px) {
  .mxp-phone-row,
  .mxp-captcha-row {
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .mxp-input,
  .mxp-select,
  .mxp-captcha-display {
    min-height: 52px;
  }

  .mxp-textarea {
    min-height: 210px;
  }
}

@media (prefers-reduced-motion:reduce) {
  html {
    scroll-behavior:auto;
  }

  .mxp-input,
  .mxp-select,
  .mxp-textarea,
  .mxp-submit {
    transition:none;
  }
}
</style>
</head>

<body>

<!-- =====================================================
     GLOBAL HEADER
     ===================================================== -->
<div id="mxp-global-header"></div>

<main class="mxp-contact-page">

  <div class="mxp-contact-container">

    <section class="mxp-contact-hero" aria-labelledby="contact-title">

      <span class="mxp-contact-eyebrow">
        Contact MaxproHealth
      </span>

      <h1 id="contact-title">
        Send us a message
      </h1>

      <p>
        Have a question, suggestion, partnership inquiry, or need
        more information? Send us your inquiry and our team will
        review your message.
      </p>

    </section>

    <section
      class="mxp-contact-card"
      aria-label="Contact form">

      <form
        class="mxp-form"
        id="mxpContactForm"
        action="https://formsubmit.co/"
        method="POST"
        novalidate>

        <input
          type="hidden"
          name="_subject"
          value="New MaxproHealth Contact Inquiry">

        <input
          type="hidden"
          name="_captcha"
          value="false">

        <input
          type="hidden"
          name="_template"
          value="table">

        <input
          type="hidden"
          name="_next"
          value="https://maxprohealth.pages.dev/thank-you">

        <input
          class="mxp-honeypot"
          type="text"
          name="_honey"
          tabindex="-1"
          autocomplete="off"
          aria-hidden="true">

        <!-- NAME -->
        <div class="mxp-field">
          <input
            class="mxp-input"
            id="mxpName"
            name="name"
            type="text"
            placeholder="Full name *"
            autocomplete="name"
            maxlength="100"
            required>
        </div>

        <!-- EMAIL -->
        <div class="mxp-field">
          <input
            class="mxp-input"
            id="mxpEmail"
            name="email"
            type="email"
            placeholder="Email address *"
            autocomplete="email"
            maxlength="150"
            required>
        </div>

        <!-- PHONE -->
        <div class="mxp-field">

          <div class="mxp-phone-row">

            <select
              class="mxp-select"
              id="mxpCountry"
              name="country_code"
              aria-label="Country calling code"
              required>
            </select>

            <input
              class="mxp-input"
              id="mxpPhone"
              name="phone"
              type="tel"
              placeholder="Phone number *"
              autocomplete="tel"
              inputmode="tel"
              maxlength="30"
              required>

          </div>

        </div>

        <!-- PURPOSE -->
        <div class="mxp-field">

          <select
            class="mxp-select"
            id="mxpTopic"
            name="inquiry_topic"
            required>

            <option value="" selected disabled>
              --- Select Inquiry Topic ---
            </option>

            <option value="General Inquiry">
              General Inquiry
            </option>

            <option value="Product Information">
              Product Information
            </option>

            <option value="Business Partnership">
              Business Partnership
            </option>

            <option value="K-Beauty / Supplier Inquiry">
              K-Beauty / Supplier Inquiry
            </option>

            <option value="Website / Content Feedback">
              Website / Content Feedback
            </option>

          </select>

        </div>

        <!-- COMPANY -->
        <div class="mxp-field">

          <input
            class="mxp-input"
            id="mxpCompany"
            name="company"
            type="text"
            placeholder="Company (optional)"
            autocomplete="organization"
            maxlength="150">

        </div>

        <!-- MESSAGE -->
        <div class="mxp-field">

          <textarea
            class="mxp-textarea"
            id="mxpMessage"
            name="message"
            placeholder="Please tell us how we can help... or Your message..."
            maxlength="2000"
            required></textarea>

          <span
            class="mxp-character-counter"
            id="mxpCharacterCounter"
            aria-live="polite">
            0/2000 characters
          </span>

        </div>

        <!-- CAPTCHA -->
        <div class="mxp-field">

          <div class="mxp-captcha-row">

            <input
              class="mxp-input"
              id="mxpCaptchaInput"
              type="text"
              placeholder="Enter the code here *"
              maxlength="6"
              autocomplete="off"
              inputmode="text"
              required>

            <div
              class="mxp-captcha-display"
              id="mxpCaptchaDisplay"
              aria-label="Verification code">
              Loading...
            </div>

          </div>

          <button
            class="mxp-captcha-refresh"
            id="mxpCaptchaRefresh"
            type="button">
            Refresh code
          </button>

        </div>

        <p
          class="mxp-form-status"
          id="mxpFormStatus"
          aria-live="polite"></p>

        <p class="mxp-required-note">
          * Required fields
        </p>

        <button
          class="mxp-submit"
          id="mxpSubmit"
          type="submit">
          Send Inquiry
        </button>

      </form>

    </section>

  </div>

</main>

<!-- =====================================================
     GLOBAL FOOTER
     ===================================================== -->
<div id="mxp-global-footer"></div>

<!-- Global Scroll-to-top (scroll-top.html) -->
<div id="mxp-global-scroll-top"></div>

<script>
(function () {

  "use strict";

  /* =====================================================
     GLOBAL HEADER / FOOTER
     ===================================================== */

  const headerContainer =
    document.getElementById("mxp-global-header");

  const footerContainer =
    document.getElementById("mxp-global-footer");

  const scrollTopContainer =
    document.getElementById("mxp-global-scroll-top");

  function executeInsertedScripts(container) {

    container
      .querySelectorAll("script")
      .forEach(function (oldScript) {

        const newScript =
          document.createElement("script");

        Array.from(oldScript.attributes)
          .forEach(function (attribute) {

            newScript.setAttribute(
              attribute.name,
              attribute.value
            );

          });

        newScript.textContent =
          oldScript.textContent;

        oldScript.parentNode.replaceChild(
          newScript,
          oldScript
        );

      });

  }

  function loadGlobalPart(url, target) {

    return fetch(url, {
      method: "GET",
      credentials: "same-origin",
      cache: "no-cache"
    })

    .then(function (response) {

      if (!response.ok) {
        throw new Error(
          "Unable to load " + url
        );
      }

      return response.text();

    })

    .then(function (html) {

      target.innerHTML = html;

      executeInsertedScripts(target);

    });

  }

  Promise.all([
    loadGlobalPart(
      "header.html",
      headerContainer
    ),
    loadGlobalPart(
      "footer.html",
      footerContainer
    ),
    loadGlobalPart(
      "scroll-top.html",

    ["Uganda","+256","UG"],
    ["Ukraine","+380","UA"],
    ["United Arab Emirates","+971","AE"],
    ["United Kingdom","+44","GB"],
    ["United States","+1","US"],
    ["United States Minor Outlying Islands","+1","UM"],
    ["United States Virgin Islands","+1-340","VI"],
    ["Uruguay","+598","UY"],
    ["Uzbekistan","+998","UZ"],

    ["Vanuatu","+678","VU"],
    ["Venezuela","+58","VE"],
    ["Vietnam","+84","VN"],

    ["Wallis and Futuna","+681","WF"],
    ["Western Sahara","+212","EH"],

    ["Yemen","+967","YE"],

    ["Zambia","+260","ZM"],
    ["Zimbabwe","+263","ZW"]

  ];


  /* =====================================================
     POPULATE COUNTRY SELECT
     ===================================================== */

  const countrySelect =
    document.getElementById("mxpCountry");

  countries.forEach(function (country) {

    const option =
      document.createElement("option");

    option.value = country[2];

    option.dataset.dialCode =
      country[1];

    option.textContent =
      country[0] + " [" + country[1] + "]";

    countrySelect.appendChild(option);

  });


  /* =====================================================
     DEFAULT = SOUTH KOREA
     ===================================================== */

  function selectCountry(countryCode) {

    if (!countryCode) {
      return false;
    }

    const code =
      String(countryCode)
        .trim()
        .toUpperCase();

    const option =
      Array.from(countrySelect.options)
        .find(function (item) {
          return item.value === code;
        });

    if (!option) {
      return false;
    }

    countrySelect.value = code;

    return true;
  }

  selectCountry("KR");


  /* =====================================================
     IP AUTO-DETECTION
     ===================================================== */

  function detectCountryByIP() {

    fetch("https://ipapi.co/json/", {
      method: "GET",
      headers: {
        "Accept": "application/json"
      },
      cache: "no-store"
    })

    .then(function (response) {

      if (!response.ok) {
        throw new Error("IP country detection failed.");
      }

      return response.json();

    })

    .then(function (data) {

      if (
        data &&
        typeof data.country_code === "string"
      ) {

        selectCountry(
          data.country_code
        );

      }

    })

    .catch(function () {

      /*
       * If IP detection fails, KR remains
       * selected as the project fallback.
       */

      selectCountry("KR");

    });

  }

  detectCountryByIP();


  /* =====================================================
     MESSAGE COUNTER
     ===================================================== */

  const message =
    document.getElementById("mxpMessage");

  const counter =
    document.getElementById("mxpCharacterCounter");

  function updateCounter() {

    counter.textContent =
      message.value.length +
      "/2000 characters";

  }

  message.addEventListener(
    "input",
    updateCounter
  );


  /* =====================================================
     CAPTCHA
     ===================================================== */

  const captchaDisplay =
    document.getElementById(
      "mxpCaptchaDisplay"
    );

  const captchaInput =
    document.getElementById(
      "mxpCaptchaInput"
    );

  const captchaRefresh =
    document.getElementById(
      "mxpCaptchaRefresh"
    );

  let captchaCode = "";

  function generateCaptcha() {

    const characters =
      "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let generated = "";

    for (
      let index = 0;
      index < 6;
      index++
    ) {

      generated +=
        characters.charAt(
          Math.floor(
            Math.random() *
            characters.length
          )
        );

    }

    captchaCode =
      generated;

    captchaDisplay.textContent =
      captchaCode;

    captchaInput.value = "";

  }

  captchaRefresh.addEventListener(
    "click",
    generateCaptcha
  );

  generateCaptcha();


  /* =====================================================
     FORM VALIDATION
     ===================================================== */

  const form =
    document.getElementById(
      "mxpContactForm"
    );

  const topic =
    document.getElementById(
      "mxpTopic"
    );

  const status =
    document.getElementById(
      "mxpFormStatus"
    );

  const submitButton =
    document.getElementById(
      "mxpSubmit"
    );


  form.addEventListener(
    "submit",
    function (event) {

      status.textContent = "";

      status.classList.remove(
        "success"
      );


      if (!form.checkValidity()) {

        event.preventDefault();

        form.reportValidity();

        return;

      }


      if (!topic.value) {

        event.preventDefault();

        status.textContent =
          "Please select an inquiry topic.";

        topic.focus();

        return;

      }


      const enteredCode =
        captchaInput.value
          .trim()
          .toUpperCase();


      if (
        !enteredCode ||
        enteredCode !== captchaCode
      ) {

        event.preventDefault();

        status.textContent =
          "The verification code is incorrect. Please try again.";

        generateCaptcha();

        captchaInput.focus();

        return;

      }


      /*
       * Prevent duplicate submissions.
       */

      submitButton.disabled = true;

      submitButton.textContent =
        "Sending...";

    }
  );

})();
</script>

</body>
</html>
