<style>
.mxp-scroll-top {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 999;
  width: 50px;
  height: 50px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 50%;
  background: #16845b;
  color: #ffffff;
  box-shadow: 0 10px 28px rgba(22,132,91,0.28);
  cursor: pointer;
  opacity: 0;
  visibility: hidden;
  transform: translateY(12px);
  transition:
    opacity 0.25s ease,
    visibility 0.25s ease,
    transform 0.25s ease,
    background 0.2s ease,
    box-shadow 0.2s ease;
}

.mxp-scroll-top.visible {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.mxp-scroll-top:hover {
  background: #0d6846;
  transform: translateY(-2px);
  box-shadow: 0 12px 30px rgba(22,132,91,0.38);
}

/* Modern, refined arrow icon */
.mxp-scroll-icon {
  width: 24px;
  height: 24px;
  display: block;
  flex-shrink: 0;
  transition: transform 0.22s ease;
}

.mxp-scroll-icon svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.mxp-scroll-icon path {
  fill: none;
  stroke: currentColor;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.mxp-scroll-top:hover .mxp-scroll-icon {
  transform: translateY(-2px);
}

.mxp-scroll-top:active .mxp-scroll-icon {
  transform: translateY(-1px);
}

.mxp-scroll-top:focus-visible {
  outline: 3px solid #8de5bd;
  outline-offset: 4px;
}

@media (max-width: 600px) {
  .mxp-scroll-top {
    right: 16px;
    bottom: 16px;
    width: 45px;
    height: 45px;
  }

  .mxp-scroll-icon {
    width: 23px;
    height: 23px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .mxp-scroll-top,
  .mxp-scroll-icon {
    transition: none;
  }
}
</style>

<button
  class="mxp-scroll-top"
  id="mxpScrollTop"
  type="button"
  aria-label="Scroll to top"
  title="Back to top">

  <span class="mxp-scroll-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 19V5"/>
      <path d="M5.5 11.5 12 5l6.5 6.5"/>
    </svg>
  </span>

</button>

<script>
(function () {
  "use strict";

  var button = document.getElementById("mxpScrollTop");

  if (!button || button.dataset.mxpBound === "1") return;
  button.dataset.mxpBound = "1";

  function updateButton() {
    if (window.scrollY > 450) {
      button.classList.add("visible");
    } else {
      button.classList.remove("visible");
    }
  }

  window.addEventListener("scroll", updateButton, { passive: true });

  button.addEventListener("click", function () {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  updateButton();
})();
</script>
